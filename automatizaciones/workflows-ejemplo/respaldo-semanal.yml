# EJEMPLO: este archivo NO se ejecuta aquí. Para usarlo, cópialo a .github/workflows/ y crea los secretos (ver docs/06).
# ============================================================================
#  Autor: Guillermo Navarrete · GitHub @GuillermoNavarreteHer
#  Tarea automática de GitHub Actions que ejecuta el respaldo en Excel de cada viernes.
#  Los datos de conexión NO están aquí: vienen de Settings → Secrets and
#  variables → Actions (Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#  SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM · Variable: APP_URL).
#  Se puede correr a mano en Actions → (esta tarea) → Run workflow.
# ============================================================================
name: Respaldo semanal en Excel

on:
  schedule:
    # Viernes 5:00 pm hora de México (23:00 UTC)
    - cron: '0 23 * * 5'
  workflow_dispatch: {}

concurrency:
  group: respaldo-semanal
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automatizaciones/scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node respaldo.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
